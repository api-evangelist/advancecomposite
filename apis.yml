aid: advancecomposite
name: Advance Composite
description: >-
  Advance Composite Corporation (アドバンスコンポジット株式会社) is a Japanese advanced-materials manufacturer
  founded on 22 July 2015 and headquartered at 2259-9 Oobuchi, Fuji City, Shizuoka Prefecture, with a
  Tokyo branch in Otemachi, Chiyoda-ku. The company develops, manufactures and sells metal matrix
  composite (MMC) materials and joined products using a proprietary squeeze-casting / molten-metal
  forging process that impregnates reinforcement materials such as graphite, alumina and other ceramics
  with molten aluminium under high pressure, producing parts with few internal voids. Its published
  material families include the ACM-H series (New ACM-H1/H2/H3 aluminium-graphite composites), AC-Alox
  (aluminium/alumina) and AC-Albolon, marketed on high thermal conductivity, low thermal expansion, low
  density and high stiffness for semiconductor manufacturing equipment, data centres, air conditioning,
  medical devices, mobility and rail. It is ISO 9001:2015 certified (Intertek registration 15556, UKAS
  accredited, first issued 2023-11-08), won the IVS2025 LAUNCHPAD, and raised a Series B from Kyoto iCAP
  in 2026. Advance Composite is a physical-materials manufacturer, not a software vendor: it publishes no
  developer program, public API, SDK, or machine-readable API contract of any kind.
